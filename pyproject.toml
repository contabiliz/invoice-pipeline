[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "invoice-models",
    "invoice-processors",
    "celery[redis]>=5.4",
    "gevent>=24.2",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "httpx>=0.27",
    "google-genai>=1.0",
    "structlog>=24.0",
    "pillow>=10.3",
    "lxml>=5.2",
]

[tool.uv.sources]
invoice-models = { git = "https://github.com/contabiliz/invoice-models.git", tag = "v1.4.0" }
invoice-processors = { git = "https://github.com/contabiliz/invoice-processors.git", tag = "v1.1.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_pipeline"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "testcontainers[redis,postgres]",
    "python-semantic-release",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_parser = "conventional"
tag_format = "v{version}"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
